clone:
  depth: full # depth defined
options:
  max-time: 30 # pipeline max-time execution set to 30 mins  
definitions:
  steps: 

  ####################### Steps defined to copy file to s3 #######################
    - step: &copy-file
        image: amazon/aws-cli:2.0.42
        name: Copy-to-s3
        script:
          - if [ -n "$Environment" ] ; then export BITBUCKET_DEPLOYMENT_ENVIRONMENT=$Environment; fi
          - . ./config/config-aws.sh
          - yum install jq -y

          - PORTFOLIO=ops
          - POD=data-load

          - json=$(cat load_info.json)
          - SCHEMA=$(echo "$json" | jq -r '.SCHEMA') 
          - TABLE=$(echo "$json" | jq -r '.TABLE') 
          - YYYYMMDD=$(echo "$json" | jq -r '.YYYYMMDD') 

          - if [[ -n ${SCHEMA// } && -n ${TABLE// } && -n ${YYYYMMDD// } ]]; then
          - echo ${DB_TYPE}
          - echo ${DB}.${SCHEMA,,}.${TABLE,,}
          - echo $YYYYMMDD
          - echo s3://${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}-${PORTFOLIO,,}-${POD,,}-bucket
          - aws --profile serverless s3 sync files s3://${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}-${PORTFOLIO,,}-${POD,,}-bucket/files/${DB_TYPE}/${DB}/${SCHEMA,,}/${TABLE,,}/$YYYYMMDD/ --exclude test.txt
          - else 
          - echo "One or to inputs missing"
          - fi


  ####################### Steps defined to delete file(s) from s3 #######################
    - step: &delete-file
        image: amazon/aws-cli:2.0.42
        name: Delete-file
        script:
          - if [ -n "$Environment" ] ; then export BITBUCKET_DEPLOYMENT_ENVIRONMENT=$Environment; fi
          - . ./config/config-aws.sh

          - PORTFOLIO=ops
          - POD=data-load
          - bucket_name=s3://${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}-${PORTFOLIO,,}-${POD,,}-bucket/
          - echo "S3 bucket - ${bucket_name}" 
          - echo ${file_path}
          - echo ${delete_type}

          - if [[ $delete_type == "DRY_RUN" ]]; then 
          - aws --profile serverless s3 rm ${bucket_name} --recursive --dryrun --exclude "*" --include "${file_path}*"

          - elif [[ $delete_type == "DELETE" ]]; then 
          - aws --profile serverless s3 rm ${bucket_name} --recursive --exclude "*" --include "${file_path}*"

          - else
          - echo "do nothing"
          - fi


    ####################### Steps defined to run glue job #######################
    - step: &Run-job
        image: amazon/aws-cli:2.0.42
        name: Run-glue-job
        script:
          - if [ -n "$Environment" ] ; then export BITBUCKET_DEPLOYMENT_ENVIRONMENT=$Environment; fi
          - . ./config/config-aws.sh
          - yum install jq -y
          - PORTFOLIO=ops
          - POD=data-load
          - json=$(cat settings.json)
          - TARGET_DB=$(echo "$json" | jq -r '.TARGET_DB') 
          - TARGET_TABLE=$(echo "$json" | jq -r '.TARGET_TABLE')
          - SOURCE_FILE=$(echo "$json" | jq -r '.SOURCE_FILE') 
          - PRE_SQL_FILE=$(echo "$json" | jq -r '.PRE_SQL_FILE') 
          - POST_SQL_FILE=$(echo "$json" | jq -r '.POST_SQL_FILE') 
          - EMAIL_TO=$(echo "$json" | jq -r '.EMAIL_TO')
          - echo $DEBUG_IND

          - EXEC="N"
          - if [[ -n "${TARGET_DB// }" && ( -n "${PRE_SQL_FILE// }" || -n "${POST_SQL_FILE// }") ]]; then EXEC="Y"
          - elif [[ -n "${TARGET_DB// }" && -n "${SOURCE_FILE// }" && -n "${TARGET_TABLE// }" ]]; then EXEC="Y"
          - fi
          - echo $EXEC

          - if [[ -n "${EMAIL_TO// }" && $EXEC == "Y" ]]; then EMAIL_IND="Y"; else EMAIL_IND="N"; fi
          - echo $EMAIL_IND
          
          - if [[ $EXEC == "Y" ]]; then
          - if [[ -z "${TARGET_DB// }" ]]; then TARGET_DB="-"; else echo $TARGET_DB; fi
          - if [[ -z "${TARGET_TABLE// }" ]]; then TARGET_TABLE="-"; else echo $TARGET_TABLE; fi
          - if [[ -z "${SOURCE_FILE// }" ]]; then SOURCE_FILE="-" 
          - else 
          - SOURCE_FILE=${SOURCE_FILE/<environment>/${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}}
          - echo $SOURCE_FILE
          - fi
          - if [[ -z "${PRE_SQL_FILE// }" ]]; then PRE_SQL_FILE="-" 
          - else 
          - PRE_SQL_FILE=${PRE_SQL_FILE/<environment>/${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}}
          - echo $PRE_SQL_FILE
          - fi
          - if [[ -z "${POST_SQL_FILE// }" ]]; then POST_SQL_FILE="-" 
          - else 
          - POST_SQL_FILE=${POST_SQL_FILE/<environment>/${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,}}
          - echo $POST_SQL_FILE
          - fi
          - echo $WRITE_OPTION
          - if [[ $EMAIL_IND == "Y" ]]; then
          - aws --profile serverless glue start-job-run --job-name ${PORTFOLIO,,}-${POD,,} --arguments="--env=${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,},--source_file=${SOURCE_FILE},--target_db=$TARGET_DB,--target_table=$TARGET_TABLE,--write_option=$WRITE_OPTION,--pre_script=$PRE_SQL_FILE,--post_script=$POST_SQL_FILE,--debug_ind=$DEBUG_IND,--email_to=$EMAIL_TO"
          - else
          - aws --profile serverless glue start-job-run --job-name ${PORTFOLIO,,}-${POD,,} --arguments="--env=${BITBUCKET_DEPLOYMENT_ENVIRONMENT,,},--source_file=${SOURCE_FILE},--target_db=$TARGET_DB,--target_table=$TARGET_TABLE,--write_option=$WRITE_OPTION,--pre_script=$PRE_SQL_FILE,--post_script=$POST_SQL_FILE,--debug_ind=$DEBUG_IND"
          - fi
          - else
          - echo "Nothing to do"
          - fi


pipelines:
  custom:
    Copy to S3:
      - variables:
        - name: BITBUCKET_DEPLOYMENT_ENVIRONMENT
          default: development
          allowed-values:
            - evaluation
            - development
            - ftest
            - staging
            - ptest
            - production
        - name: DB_TYPE
          default: oracle
          allowed-values:
            - oracle
            - postgres
        - name: DB
          default: RAE
          allowed-values:
            - RAE
            - DW
            - SEC
            - ERAS
            - AMCAS
            - ATS
            - EIS
            - edc
            - eras
            - mcat
            - mda
            - ps
      - step:
          <<: *copy-file
          name: Copy-to-env

    Delete from S3:
      - variables:
        - name: BITBUCKET_DEPLOYMENT_ENVIRONMENT
          default: development
          allowed-values:
            - evaluation
            - development
            - ftest
            - staging
            - ptest
            - production
        - name: file_path
        - name: delete_type
          default: DRY_RUN
          allowed-values:
            - DRY_RUN
            - DELETE
      - step:
          <<: *delete-file
          name: Delete-file

    Run-job:
      - variables:
          - name: BITBUCKET_DEPLOYMENT_ENVIRONMENT
            default: development
            allowed-values:
              - evaluation
              - development
              - ftest
              - staging
              - ptest
              - production
          - name: WRITE_OPTION
            default: append
            allowed-values:
              - append
              - truncate
          - name: DEBUG_IND
            default: N
            allowed-values:
              - N
              - Y
      - step:
          <<: *Run-job
          name: Run job
